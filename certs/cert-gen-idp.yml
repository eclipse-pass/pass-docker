# Gen cert for IDP

services:
  cert-gen-idp:
    image: "eclipse-temurin:17.0.21.1_2-jre-jammy"
    # 17.0.21.1_2 (CVE-2026-114938 fix) has no linux/arm64 image yet (adoptium/containers#1146). Docker then falls
    # back to the 32-bit arm/v7 image, whose JCE init fails under emulation, so run the amd64 build instead.
    platform: linux/amd64
    container_name: cert-gen-idp
    command:
      - /bin/bash
      - -c
      - |
        set -e
        if [ -f /idp/credentials/shib-idp/idp-encryption.crt ]; then
          echo "PKI for IDP already exists"
          exit 0
        fi
        echo "Creating PKI for IDP"
        chmod +x /scripts/cert-gen.sh
        chmod +x /scripts/cert-gen-idp.sh
        mkdir /cert-gen-output
        ./scripts/cert-gen-idp.sh
    # security_opt section here for Podman, lets the chmod commands work
    security_opt:
      - label=disable
    volumes:
      - ./cert-gen.sh:/scripts/cert-gen.sh
      - ./cert-gen-idp.sh:/scripts/cert-gen-idp.sh
      - ../idp:/idp
      - ../pass-core:/pass-core
